AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lokales Testen der Brunnenstube Pumproom Lambda mit Test-Datenbank

Resources:
  PumproomFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      CodeUri: ./
      MemorySize: 128
      Timeout: 15
      Environment:
        Variables:
          DATA_TABLE: pumproom_data_test
          LATEST_TABLE: pumproom_latest_test
          AWS_REGION: eu-north-1 # <-- HIER die Region deiner Test-Datenbank eintragen (z.B. eu-central-1 oder eu-north-1)
      Policies:
        - AmazonDynamoDBFullAccess
