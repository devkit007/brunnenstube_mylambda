AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lokales Testen der Brunnenstube Pumproom Lambda mit Test-Datenbank

Resources:
  PumproomFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: alarm_check.lambda_handler
      Runtime: python3.12
      CodeUri: ./
      MemorySize: 128
      Timeout: 15
      Policies:
        - AmazonDynamoDBFullAccess
